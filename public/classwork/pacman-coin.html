<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小精靈吃金幣</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #1b1b2f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            color: #fff;
        }

        *::before{
            box-sizing: border-box;
        }


        .game-container {
            position: relative;
            width: 600px;
            max-width: 90vw;
            height: 80px;
        }

        .track {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 0;
            border-bottom: 5px solid #444;
        }

        .coin {
            position: absolute;
            top: -10px;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle at 35% 35%, #fff7b0, #ffd700 60%, #b8860b 100%);
            border-radius: 50%;
            box-shadow: 0 0 6px #ffd700;
        }

        .coin1 {
            left: 60px;
            animation: eatCoin1 6s linear infinite;
        }

        .coin2 {
            left: 160px;
            animation: eatCoin2 6s linear infinite;
        }

        .coin3 {
            left: 260px;
            animation: eatCoin3 6s linear infinite;
        }

        .coin4 {
            left: 360px;
            animation: eatCoin4 6s linear infinite;
        }

        .coin5 {
            left: 460px;
            animation: eatCoin5 6s linear infinite;
        }

        .coin6 {
            left: 540px;
            animation: eatCoin6 6s linear infinite;
        }

        @keyframes eatCoin1 {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            7% {
                opacity: 1;
                transform: scale(1);
            }

            8% {
                opacity: 0;
                transform: scale(0);
            }

            100% {
                opacity: 0;
                transform: scale(0);
            }
        }

        @keyframes eatCoin2 {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            25% {
                opacity: 1;
                transform: scale(1);
            }

            26% {
                opacity: 0;
                transform: scale(0);
            }

            100% {
                opacity: 0;
                transform: scale(0);
            }
        }

        @keyframes eatCoin3 {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            44% {
                opacity: 1;
                transform: scale(1);
            }

            45% {
                opacity: 0;
                transform: scale(0);
            }

            100% {
                opacity: 0;
                transform: scale(0);
            }
        }

        @keyframes eatCoin4 {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            62% {
                opacity: 1;
                transform: scale(1);
            }

            63% {
                opacity: 0;
                transform: scale(0);
            }

            100% {
                opacity: 0;
                transform: scale(0);
            }
        }

        @keyframes eatCoin5 {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            80% {
                opacity: 1;
                transform: scale(1);
            }

            81% {
                opacity: 0;
                transform: scale(0);
            }

            100% {
                opacity: 0;
                transform: scale(0);
            }
        }

        @keyframes eatCoin6 {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            94% {
                opacity: 1;
                transform: scale(1);
            }

            95% {
                opacity: 0;
                transform: scale(0);
            }

            100% {
                opacity: 0;
                transform: scale(0);
            }
        }

        .pacman {
            position: absolute;
            top: 50%;
            left: 0;
            width: 50px;
            height: 50px;
            margin-top: -25px;
            border-radius: 50%;
            background: #ffd700;



            clip-path: polygon(50% 50%,
                    100% 15%,
                    100% 0%,
                    0% 0%,
                    0% 100%,
                    100% 100%,
                    100% 85%);

            animation: move 6s linear infinite,
                chomp 0.3s linear infinite;


        }

        .pacman::before {
            content: '';
            display: block;
            position: absolute;
            top: 10px;
            left: 25px;
            width: 6px;
            height: 6px;
            background: white;
            border: 2px solid black;
            border-radius: 50%;
            transition: width 0.2s ease, height 0.2s ease, background 0.2s ease, border 0.2s ease;
        }

        .pacman:hover::before {
            width: 10px;
            height: 10px;
            background-color: black;
            border: 2px solid white;
        }


        
        @keyframes move {
            0% {
                left: 0px;
            }

            100% {
                left: 550px;
            }
        }

        @keyframes chomp {
            0% {
                clip-path: polygon(50% 50%,
                        100% 15%,
                        100% 0%,
                        0% 0%,
                        0% 100%,
                        100% 100%,
                        100% 85%);
            }

            50% {
                clip-path: polygon(50% 50%,
                        100% 50%,
                        100% 0%,
                        0% 0%,
                        0% 100%,
                        100% 100%,
                        100% 50%);
            }

            100% {
                clip-path: polygon(50% 50%,
                        100% 15%,
                        100% 0%,
                        0% 0%,
                        0% 100%,
                        100% 100%,
                        100% 85%);
            }
        }
    </style>
</head>

<body>
    <div class="game-container">
        <div class="track">
            <div class="coin coin1"></div>
            <div class="coin coin2"></div>
            <div class="coin coin3"></div>
            <div class="coin coin4"></div>
            <div class="coin coin5"></div>
            <div class="coin coin6"></div>
        </div>

        <div class="pacman">
            <!-- <div class="eye"></div> -->
        </div>
    </div>

</body>

</html>
