<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剪刀石頭布</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            padding: 30px 20px;
            display: grid;
            place-items: center;
            box-sizing: border-box;
        }

        .flex {
            width: min(100%, 500px);
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .box {
            background-color: antiquewhite;
            width: 100%;
            min-height: 180px;
            box-sizing: border-box;
            padding: 50px;
            margin-bottom: 10px;
        }

        img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }
        #result{
            font-size: 48px;
            text-align: center;
            font-family: "微軟正黑體";
            margin-top: 16px;

        }
        #cp{
            background-color: white;
        }

        @media (max-width: 520px) {
            .box {
                padding: 28px 16px;
            }

            img {
                width: 78px;
                height: 78px;
            }

            #result {
                font-size: 34px;
            }
        }

    </style>
</head>

<body>
    <section class="flex">
            <div class="box">
                <H2>玩家</H2>
                <div>
                    <button id="scissors" type="button">
                        <img src="./img/剪刀.png" alt="">
                    </button>
                    <button id="rock" type="button">
                        <img src="./img/石頭.png" alt="">
                    </button>
                    <button id="paper" type="button">
                        <img src="./img/布.png" alt="">
                    </button>
                </div>
            </div>

            <div class="box">
                <H2>電腦</H2>
                <div>
                    <img id="cp" src="./img/問號.png" alt="">
                </div>
            </div>
    
        <div id="result">顯示結果</div>
    
    
    <script>
        // 玩家的三個選項
        // 剪刀
        const scissors = document.querySelector("#scissors");
        // 石頭
        const rock = document.querySelector("#rock");
        // 布
        const paper = document.querySelector("#paper");
        // 輸贏結果
        const result = document.querySelector("#result");
        // 電腦選項
        const cp = document.querySelector("#cp");
        // 剪刀
        scissors.addEventListener('click', function () {
            console.log('scissors');
            let randomNum = Math.floor(Math.random() * 3);
            console.log(randomNum);
            let text01 = '';
            let textcp = '';
            if (randomNum == 2) {
                text01 = "你贏了!!";
                textcp = './img/布.png';
                console.log("你贏了!!");
            } else if (randomNum == 1) {
                text01 = "電腦勝利~~";
                textcp = './img/石頭.png';
                console.log("電腦勝利~~");
            }
            else {
                text01 = "再來一局";
                textcp = './img/剪刀.png';
                console.log("再來一局");
            }

            result.textContent = text01;
            cp.src = textcp;


        });
        // 石頭
        rock.addEventListener('click', function () {
            console.log('rock');
            let randomNum = Math.floor(Math.random() * 3);
            console.log(randomNum);
            let text01 = '';
            let textcp = '';
            if (randomNum == 2) {
                text01 = "電腦勝利~~";
                textcp = './img/布.png';
                console.log("電腦勝利~~");
            } else if (randomNum == 1) {
                text01 = "再來一局";
                textcp = './img/石頭.png';
                console.log("再來一局");
            } else {
                text01 = "你贏了!!";
                textcp = './img/剪刀.png';
                console.log("你贏了!!");
            }

            result.textContent = text01;
            cp.src = textcp;
        });

        // 布
        paper.addEventListener('click', function () {
            console.log('paper');
            let randomNum = Math.floor(Math.random() * 3);
            console.log(randomNum);
            let text01 = '';
            let textcp = '';
            if (randomNum == 2) {
                text01 = "再來一局";
                textcp = './img/布.png';
                console.log("再來一局");
            } else if (randomNum == 1) {
                text01 = "你贏了!!";
                textcp = './img/石頭.png';
                console.log("你贏了!!");
            } else {
                text01 = "電腦勝利~~";
                textcp = './img/剪刀.png';
                console.log("電腦勝利~~");
            }

            result.textContent = text01;
            cp.src = textcp;
        });


    </script>
</body>

</html>
